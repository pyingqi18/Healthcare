[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ratings-research"
version = "0.1.0"
description = "Reproducible pipeline for medical institution ratings research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
analysis = [
  "statsmodels>=0.14",
  "linearmodels>=7.0",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.24",
  "folium>=0.17",
]
scraping = [
  "beautifulsoup4>=4.12",
  "tldextract>=5.1",
  "python-whois>=0.9",
]
nlp = [
  "transformers>=4.44",
  "torch>=2.4",
  "tqdm>=4.66",
]
test = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
